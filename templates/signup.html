<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8e9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .signup-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1b5e20;
        }

        .error {
            color: red;
            text-align: center;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>

</head>

<body>

<header>
    <h1>🌾 Smart Farmer</h1>
    <p>Create your farmer account</p>
</header>

<main>

    <div class="signup-box">

        <h2>📝 Create Account</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/signup">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                📝 Create Account
            </button>

        </form>

        <div class="login">

            <p>
                Already have an account?
            </p>

            <a href="/login">
                🔑 Login
            </a>

        </div>

    </div>

</main>

</body>
</html>
