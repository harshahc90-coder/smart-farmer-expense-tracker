<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Farm Income</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>🌾 Add Farm Income</h1>
    <p>Record money earned from farming</p>
</header>

<main>

    <div class="card">

        <h2>💰 Income Details</h2>

        <form action="/add-income" method="POST">

            <label>Amount (₹)</label>

            <input
                type="number"
                name="amount"
                placeholder="Enter amount"
                min="1"
                step="0.01"
                required
            >

            <label>Income Source</label>

            <input
                type="text"
                name="source"
                placeholder="Example: Rice sale"
                required
            >

            <label>Date</label>

            <input
                type="date"
                name="date"
                required
            >

            <label>Description</label>

            <textarea
                name="description"
                placeholder="Example: Sold 10 bags of rice"
                rows="4"
            ></textarea>

            <button type="submit">
                💾 Save Income
            </button>

        </form>

        <br>

        <a href="/">⬅️ Back to Dashboard</a>

    </div>

</main>

</body>
</html>
