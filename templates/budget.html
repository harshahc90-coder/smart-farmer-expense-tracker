<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farm Budget</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>🎯 Farm Budget</h1>
    <p>Set and manage your monthly farming budgets</p>
</header>

<main>

    <div class="history-header">

        <h2>Monthly Budgets</h2>

        <a href="/" class="action-button">
            ⬅️ Dashboard
        </a>

    </div>


    <!-- ADD BUDGET -->

    <div class="card">

        <h2>➕ Set Monthly Budget</h2>

        <form action="/budget" method="POST">

            <label for="category">
                Category
            </label>

            <select id="category" name="category" required>

                <option value="">
                    Select category
                </option>

                <option value="Seeds">
                    🌾 Seeds
                </option>

                <option value="Fertilizers">
                    🧪 Fertilizers
                </option>

                <option value="Pesticides">
                    🧴 Pesticides
                </option>

                <option value="Labour">
                    👷 Labour
                </option>

                <option value="Fuel">
                    ⛽ Fuel
                </option>

                <option value="Machinery">
                    🚜 Machinery
                </option>

            </select>


            <label for="month">
                Month
            </label>

            <input
                type="month"
                id="month"
                name="month"
                required
            >


            <label for="amount">
                Budget Amount (₹)
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Enter budget amount"
                min="1"
                step="0.01"
                required
            >


            <button type="submit">
                💾 Save Budget
            </button>

        </form>

    </div>


    <!-- EXISTING BUDGETS -->

    <h2>📊 Your Budgets</h2>

    <div class="expenses">

        {% for budget in budgets %}

        <div class="expense-item">

            <div>

                <strong>
                    {{ budget["category"] }}
                </strong>

                <br>

                <small>
                    {{ budget["month"] }}
                </small>

            </div>

            <strong>
                ₹{{ "%.2f"|format(budget["amount"]) }}
            </strong>

        </div>

        {% else %}

        <div class="card">
            <p>No budgets created yet.</p>
        </div>

        {% endfor %}

    </div>

</main>

</body>
</html>
